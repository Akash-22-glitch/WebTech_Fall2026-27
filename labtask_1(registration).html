<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device -width,initial-scale=1.0">
        <title>Registration Page</title>
        <style>
            label{
                display: inline-block;
                width: 140px;
            }
            textarea{
                vertical-align: middle;
            }
        </style>

    </head>
    <body>
        <h1>Registration From</h1>
       
        <img src="akash.jpg.jfif" alt="My Picture" width="200" height="200">

        <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">
        <br><label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br>
        <label for="pasword">Pasword:</label>
        <input type="password" id="pasword" name="password">
        <br>
        <label for="comment">Comment:</label>
        <textarea id="comment" name="comment" rows="4" cols="30"></textarea>
       <br>
       <label>Gender:</label>
       <br>
       <input type="radio" id="male" name="gender" value="Male">
       <label for="male">Male</label>
       <input type="radio" id="female" name="gender" value="Female">
       <label for="female">Female</label>
       <br>
       <lable>Hobby:</lable>
       <input type="checkbox" id="cricket" name="hobby" value="Cricket">
       <lable for="cricket">Cricket</lable>
       <br>
       <label for="file">Choose a File:</label>
       <input type="file" id="file" name="file">
       <br><br>
       <input type="submit" value="Submit">
       <input type="reset" value="Reset">
       
        </form>
        
    </body>
</html>
